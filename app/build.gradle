plugins {
    alias(libs.plugins.android.application)
}

// ── Ads ──────────────────────────────────────────────────────────────────────
// Switch ads with ads.enabled / ads.mode in gradle.properties (or -Pads.mode=test on the command line).
def adsEnabled = (project.findProperty('ads.enabled') ?: 'true').toString().toBoolean()
def adsMode = (project.findProperty('ads.mode') ?: 'auto').toString()
// Real unit IDs come from the AdMob console. An empty ID turns that placement off in release builds.
def admob = [
        test: [appId       : 'ca-app-pub-3940256099942544~3347511713',
               banner      : 'ca-app-pub-3940256099942544/9214589741',
               nativeAd    : 'ca-app-pub-3940256099942544/2247696110',
               interstitial: 'ca-app-pub-3940256099942544/1033173712',
               rewarded    : 'ca-app-pub-3940256099942544/5224354917'],
        real: [appId       : 'ca-app-pub-8976959600358837~3318589324',
               banner      : 'ca-app-pub-8976959600358837/1610809888',
               nativeAd    : '',   // "Native advanced" unit
               interstitial: '',   // "Interstitial" unit
               rewarded    : ''],  // "Rewarded" unit
]
def useTestAds = { boolean debugBuild -> adsMode == 'test' || (adsMode == 'auto' && debugBuild) }
def configureAds = { buildType, boolean debugBuild ->
    def ids = useTestAds(debugBuild) ? admob.test : admob.real
    buildType.buildConfigField 'boolean', 'ADS_ENABLED', adsEnabled.toString()
    buildType.buildConfigField 'boolean', 'ADS_TEST_MODE', useTestAds(debugBuild).toString()
    buildType.buildConfigField 'String', 'AD_BANNER_ID', "\"${ids.banner}\""
    buildType.buildConfigField 'String', 'AD_NATIVE_ID', "\"${ids.nativeAd}\""
    buildType.buildConfigField 'String', 'AD_INTERSTITIAL_ID', "\"${ids.interstitial}\""
    buildType.buildConfigField 'String', 'AD_REWARDED_ID', "\"${ids.rewarded}\""
    buildType.manifestPlaceholders['admobAppId'] = ids.appId
}

android {
    namespace 'net.golbarg.engtoper'
    compileSdk 36

    defaultConfig {
        applicationId "net.golbarg.engtoper"
        minSdk 28
        targetSdk 36
        versionCode 6
        versionName "1.6"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        setProperty("archivesBaseName", "eng-to-per-$versionName")
    }

    buildTypes {
        debug {
            configureAds(delegate, true)
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            configureAds(delegate, false)
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
        buildConfig true
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.lifecycle.livedata.ktx
    implementation libs.lifecycle.viewmodel.ktx
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    implementation libs.play.services.ads
    implementation libs.user.messaging.platform

    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
}